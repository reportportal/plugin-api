plugins {
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'java-library'
}

project.ext {
    releaseMode = project.hasProperty("releaseMode") ? project.releaseMode.toBoolean() : false
    publishRepo = "https://maven.pkg.github.com/reportportal/plugin-api"
    dependencyRepos = ["commons-model", "commons-rules", "commons-dao", "commons-bom"]
}

def scriptsUrl = 'https://raw.githubusercontent.com/reportportal/gradle-scripts/' +
        (releaseMode ? getProperty('scripts.version') : 'develop')

apply from: scriptsUrl + '/release-commons.gradle'
apply from: scriptsUrl + '/signing.gradle'
//apply from: scriptsUrl + '/build-quality.gradle'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral { url "https://repo1.maven.org/maven2" }
    maven { url 'https://jitpack.io' }
}

ext['spring-boot.version'] = "${springBootVersion}"
ext['jackson-bom.version'] = "${jacksonVersion}"
ext['spring-framework.version'] = "${springFrameworkVersion}"
ext['spring-security.version'] = "${springSecurityVersion}"

dependencyManagement {
    imports {
        mavenBom(releaseMode ? 'com.epam.reportportal:commons-bom:' + getProperty('bom.version') : 'com.github.reportportal:commons-bom:5.15.2')
        mavenBom "com.fasterxml.jackson:jackson-bom:${jacksonVersion}"
        mavenBom "org.springframework:spring-framework-bom:${springFrameworkVersion}"
        mavenBom "org.springframework.security:spring-security-bom:${springSecurityVersion}"
    }
}

dependencies {
    // commons-dao 5.15.7 is unpublished; pin upcoming HEAD (123253b + EPMRPP-118978 security pins)
    implementation 'com.github.reportportal:commons-dao:b56d686'
    api 'com.github.reportportal:commons:5.15.2'

    api 'org.pf4j:pf4j:3.15.0'
    api 'org.pf4j:pf4j-update:2.3.0'

    implementation 'org.hibernate:hibernate-core:6.6.5.Final'

    testImplementation "org.junit.jupiter:junit-jupiter-api"
}


wrapper {
    gradleVersion = '8.12'
}

tasks.preTagCommit.enabled = false
tasks.updateVersion.enabled = false
tasks.commitNewVersion.enabled = false
